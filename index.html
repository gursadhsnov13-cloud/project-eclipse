<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-OUTLAW: 2088</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="crosshair">+</div>
    
    <!-- HUD / İDARƏETMƏ PANELSİ -->
    <div id="hud">
        <div id="health-bar-container">
            <span class="hud-label">SAĞLAMLIQ:</span>
            <div id="health-bar"><div id="health-fill"></div></div>
        </div>
        <div id="stats">
            <p>💰 PULLAR: <span id="money-val">0</span> $</p>
            <p>🎯 TƏLƏF OLAN DRONLAR: <span id="kills-val">0</span></p>
        </div>
        <div id="mission-box">
            <h4>📌 AKTİV TAPŞIRIQ:</h4>
            <p id="mission-text">Şəhərdəki Kiber-Dronları tapın və məhv edin!</p>
        </div>
        <div id="instructions">
            <p><b>WASD:</b> Hərəkət / Sürmək</p>
            <p><b>E:</b> Maşına Min / Düş</p>
            <p><b>Siçanın Sol Düyməsi:</b> Atəş Aç</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
